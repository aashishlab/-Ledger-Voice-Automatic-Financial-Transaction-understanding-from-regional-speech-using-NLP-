<!-- =====================================================
     REGISTER PAGE — Premium Account Onboarding
     ===================================================== -->
<div style="min-height: calc(100vh - 120px); display:flex; align-items:center; justify-content:center; padding:2rem 1rem;">
  <div style="width:100%; max-width:580px;">

    <div class="auth-card p-4 p-md-5 animate-fade-up">

      <!-- Icon & Title -->
      <div class="text-center mb-4">
        <div class="auth-icon-ring" style="background: var(--green-bg); color: var(--green);">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h3 style="font-family:var(--font-heading); font-weight:800; color:var(--gray-950); margin-bottom:.3rem; font-size:1.5rem; letter-spacing:-.025em;">
          Create Your Account
        </h3>
        <p style="font-size:.87rem; color:var(--gray-400);">Start automated voice bookkeeping with AI-powered ledger management</p>
      </div>

      <!-- Error Alert -->
      <div ng-if="errorMessage" class="alert alert-danger d-flex align-items-center gap-2 mb-4" role="alert">
        <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
        <span style="font-size:.85rem;">{{ errorMessage }}</span>
      </div>

      <!-- Register Form -->
      <form ng-submit="doRegister()">
        <!-- Row 1: Username + Email -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label" style="color:var(--gray-700); font-size:.82rem;">Username *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-at" style="color:var(--primary);"></i></span>
              <input type="text" class="form-control" id="reg-username"
                     ng-model="registerData.username"
                     placeholder="johndoe" required autocomplete="username">
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label" style="color:var(--gray-700); font-size:.82rem;">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-envelope" style="color:var(--primary);"></i></span>
              <input type="email" class="form-control" id="reg-email"
                     ng-model="registerData.email"
                     placeholder="john@example.com" autocomplete="email">
            </div>
          </div>
        </div>

        <!-- Row 2: Business + Phone -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label" style="color:var(--gray-700); font-size:.82rem;">Business / Store Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-store" style="color:var(--primary);"></i></span>
              <input type="text" class="form-control" id="reg-business"
                     ng-model="registerData.business_name"
                     placeholder="John Enterprise">
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label" style="color:var(--gray-700); font-size:.82rem;">Phone Number</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-phone" style="color:var(--primary);"></i></span>
              <input type="text" class="form-control" id="reg-phone"
                     ng-model="registerData.phone"
                     placeholder="+91 9876543210" autocomplete="tel">
            </div>
          </div>
        </div>

        <!-- Row 3: Password + Confirm -->
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label" style="color:var(--gray-700); font-size:.82rem;">Password *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock" style="color:var(--primary);"></i></span>
              <input type="password" class="form-control" id="reg-password"
                     ng-model="registerData.password"
                     placeholder="At least 6 characters" required autocomplete="new-password">
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label" style="color:var(--gray-700); font-size:.82rem;">Confirm Password *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock-open" style="color:var(--primary);"></i></span>
              <input type="password" class="form-control" id="reg-confirm-password"
                     ng-model="registerData.confirm_password"
                     placeholder="Repeat password" required autocomplete="new-password">
            </div>
          </div>
        </div>

        <button type="submit" id="reg-submit"
                class="btn btn-gradient-purple w-100 py-3 mb-3 fw-bold"
                style="font-size:.9rem;"
                ng-disabled="isLoading">
          <span ng-if="isLoading">
            <span class="spinner-border spinner-border-sm me-2"></span>Creating account...
          </span>
          <span ng-if="!isLoading">
            Create Free Account <i class="fa-solid fa-arrow-right ms-2"></i>
          </span>
        </button>

        <div class="divider-with-text my-3">or</div>

        <div class="text-center" style="font-size:.85rem;">
          <span style="color:var(--gray-400);">Already registered?</span>
          <a href="#!/login" class="fw-bold ms-1" style="color: var(--primary);">Sign in here</a>
        </div>
      </form>
    </div>

    <!-- Trust indicators -->
    <div class="d-flex justify-content-center gap-4 mt-4 animate-fade-in"
         style="font-size:.75rem; color:var(--gray-400); animation-delay:.3s;">
      <span><i class="fa-solid fa-shield-halved me-1" style="color:var(--green);"></i>JWT Protected</span>
      <span><i class="fa-solid fa-lock me-1" style="color:var(--primary);"></i>PBKDF2 Hashing</span>
      <span><i class="fa-solid fa-database me-1" style="color:var(--blue);"></i>PostgreSQL</span>
    </div>
  </div>
</div>
