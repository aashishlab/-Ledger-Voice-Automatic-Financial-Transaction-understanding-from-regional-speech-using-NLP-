<!-- =====================================================
     LOGIN PAGE
     ===================================================== -->
<div class="row justify-content-center align-items-center py-4" style="min-height: calc(100vh - 140px);">
  <div class="col-md-5 col-lg-4 col-xl-3">
    <div class="auth-card p-4 p-md-5 animate-fade-up">

      <!-- Icon -->
      <div class="text-center mb-4">
        <div class="auth-icon-ring">
          <i class="fa-solid fa-right-to-bracket"></i>
        </div>
        <h3 class="fw-extrabold text-dark mb-1" style="letter-spacing:-.02em;">Welcome back</h3>
        <p class="text-muted" style="font-size:.88rem;">Sign in to your VoiceKhata account</p>
      </div>

      <!-- Error Alert -->
      <div ng-if="errorMessage" class="alert alert-danger d-flex align-items-center gap-2 mb-4" role="alert">
        <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
        <span style="font-size:.875rem;">{{ errorMessage }}</span>
      </div>

      <!-- Login Form -->
      <form ng-submit="doLogin()">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fa-solid fa-user text-purple"></i>
            </span>
            <input type="text" class="form-control" id="login-username"
                   ng-model="loginData.username"
                   placeholder="Enter your username" required autocomplete="username">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fa-solid fa-lock text-purple"></i>
            </span>
            <input type="password" class="form-control" id="login-password"
                   ng-model="loginData.password"
                   placeholder="Enter your password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="login-submit"
                class="btn btn-gradient-purple w-100 py-3 mb-3"
                style="font-size:.95rem; letter-spacing:.01em;"
                ng-disabled="isLoading">
          <span ng-if="isLoading">
            <span class="spinner-border spinner-border-sm me-2"></span>Signing in...
          </span>
          <span ng-if="!isLoading">
            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Sign In
          </span>
        </button>

        <div class="divider-with-text my-3">or</div>

        <div class="text-center" style="font-size:.875rem;">
          <span class="text-muted">Don't have an account?</span>
          <a href="#!/register" class="fw-bold ms-1"
             style="color: var(--primary-purple);">Create account</a>
        </div>
      </form>
    </div>

    <!-- Trust indicators -->
    <div class="d-flex justify-content-center gap-4 mt-3 text-muted animate-fade-in"
         style="font-size:.78rem; animation-delay:.3s;">
      <span><i class="fa-solid fa-shield-halved me-1 text-emerald"></i>JWT Secured</span>
      <span><i class="fa-solid fa-lock me-1 text-purple"></i>Encrypted</span>
      <span><i class="fa-solid fa-database me-1 text-amber"></i>PostgreSQL</span>
    </div>
  </div>
</div>
