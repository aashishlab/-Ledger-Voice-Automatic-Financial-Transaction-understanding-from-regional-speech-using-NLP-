<!-- =====================================================
     LOGIN PAGE — Premium Auth (AI Wallet style)
     ===================================================== -->
<div style="min-height: calc(100vh - 120px); display:flex; align-items:center; justify-content:center; padding:2rem 1rem;">
  <div style="width:100%; max-width:420px;">

    <!-- Auth Card -->
    <div class="auth-card p-4 p-md-5 animate-fade-up">

      <!-- Branding -->
      <div class="text-center mb-4">
        <div class="auth-icon-ring">
          <i class="fa-solid fa-right-to-bracket"></i>
        </div>
        <h3 style="font-family:var(--font-heading); font-weight:800; color:var(--gray-950); margin-bottom:.3rem; font-size:1.5rem; letter-spacing:-.025em;">
          Welcome back
        </h3>
        <p style="font-size:.87rem; color:var(--gray-400);">Sign in to access your VoiceKhata ledger</p>
      </div>

      <!-- Error Alert -->
      <div ng-if="errorMessage" class="alert alert-danger d-flex align-items-center gap-2 mb-4" role="alert">
        <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
        <span style="font-size:.85rem;">{{ errorMessage }}</span>
      </div>

      <!-- Login Form -->
      <form ng-submit="doLogin()">
        <div class="mb-3">
          <label class="form-label" style="color:var(--gray-700); font-size:.82rem;">Username</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fa-solid fa-user" style="color:var(--primary);"></i>
            </span>
            <input type="text" class="form-control" id="login-username"
                   ng-model="loginData.username"
                   placeholder="Enter your username" required autocomplete="username">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" style="color:var(--gray-700); font-size:.82rem;">Password</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fa-solid fa-lock" style="color:var(--primary);"></i>
            </span>
            <input type="password" class="form-control" id="login-password"
                   ng-model="loginData.password"
                   placeholder="Enter your password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="login-submit"
                class="btn btn-gradient-purple w-100 py-3 mb-3 fw-bold"
                style="font-size:.9rem;"
                ng-disabled="isLoading">
          <span ng-if="isLoading">
            <span class="spinner-border spinner-border-sm me-2"></span>Signing in...
          </span>
          <span ng-if="!isLoading">
            Sign In <i class="fa-solid fa-arrow-right ms-2"></i>
          </span>
        </button>

        <div class="divider-with-text my-3">or</div>

        <div class="text-center" style="font-size:.85rem;">
          <span style="color:var(--gray-400);">Don't have an account?</span>
          <a href="#!/register" class="fw-bold ms-1"
             style="color: var(--primary);">Create account</a>
        </div>
      </form>
    </div>

    <!-- Trust indicators -->
    <div class="d-flex justify-content-center gap-4 mt-4 animate-fade-in"
         style="font-size:.75rem; color:var(--gray-400); animation-delay:.3s;">
      <span><i class="fa-solid fa-shield-halved me-1" style="color:var(--green);"></i>JWT Secured</span>
      <span><i class="fa-solid fa-lock me-1" style="color:var(--primary);"></i>Encrypted</span>
      <span><i class="fa-solid fa-database me-1" style="color:var(--blue);"></i>PostgreSQL</span>
    </div>
  </div>
</div>
